name: CI

on:
  push:
    branches: [main]
    tags: ['*']
    # Skip CI when only documentation, benchmark artifacts, or tooling
    # changes — those have their own paths (docs.yml) or aren't tested
    # by `Pkg.test()`.
    paths-ignore:
      - 'docs/**'
      - 'benchmark/.julia-perf/**'
      - 'benchmark/cpp/build/**'
      - '**.md'
      - 'LICENSE'
      - 'CHANGELOG*'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'benchmark/.julia-perf/**'
      - 'benchmark/cpp/build/**'
      - '**.md'
      - 'LICENSE'
      - 'CHANGELOG*'
  schedule:
    # Monthly full-matrix sweep (1st of month, 06:00 UTC) — catch version/OS
    # regressions the per-push minimal CI misses, without the weekly macOS
    # (10× billing) cost.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      compare-minuit2:
        description: 'Collect and validate a five-pair Minuit2 benchmark record'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare-minuit2:
    if: github.event_name == 'workflow_dispatch' && inputs.compare-minuit2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13.2'
          arch: x64
      - name: Prepare pinned reference and benchmark dependencies
        run: |
          julia_source=$(python3 -c 'import json; print(json.load(open("benchmark/readme_protocol.json"))["julia_commit"])')
          cpp_source=$(python3 -c 'import json; print(json.load(open("benchmark/readme_protocol.json"))["cpp_commit"])')
          git fetch --no-tags --depth=1 origin "$julia_source"
          git diff --exit-code "$julia_source" HEAD -- Project.toml src ext
          mkdir -p reference
          git clone --no-checkout https://github.com/GooFit/Minuit2.git reference/Minuit2_cpp
          git -C reference/Minuit2_cpp checkout --detach "$cpp_source"
          cmake -S benchmark/cpp -B "$RUNNER_TEMP/minuit2-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_NO_PACKAGE_REGISTRY=ON
          cmake --build "$RUNNER_TEMP/minuit2-build" --target cpp_readme_bench --parallel 2
          julia --startup-file=no --project=benchmark -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Collect on one logical CPU
        run: |
          cpu=$(python3 -c 'import os; print(max(os.sched_getaffinity(0)))')
          set +e
          taskset -c "$cpu" python3 benchmark/compare_readme.py --source . \
            --cpp-binary "$RUNNER_TEMP/minuit2-build/cpp_readme_bench" \
            --protocol benchmark/readme_protocol.json --out "$RUNNER_TEMP/minuit2-record" --timeout 360
          code=$?
          set -e
          record="$RUNNER_TEMP/minuit2-record"
          if [ -d "$record" ]; then
            {
              printf 'collector exit: %s\nlogical CPU: %s\n' "$code" "$cpu"
              git rev-parse HEAD
              git -C reference/Minuit2_cpp rev-parse HEAD
              julia --version
              c++ --version
              uname -sr
              lscpu
            } > "$record/runner.txt"
            cp benchmark/Project.toml "$record/julia-project.toml"
            cp benchmark/Manifest.toml "$record/julia-manifest.toml"
          fi
          # Exit 2 means a complete record with rejected cases. Retain and verify it.
          test "$code" -eq 0 || test "$code" -eq 2
      - name: Verify the record and report every case
        run: |
          record="$RUNNER_TEMP/minuit2-record"
          julia --startup-file=no --project=benchmark benchmark/check_readme_evidence.jl "$record"
          python3 - "$record" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import pathlib
          import sys

          record = pathlib.Path(sys.argv[1])
          report = json.loads((record / "summary.json").read_text())
          check = json.loads((record / "julia-evidence-check.json").read_text())
          assert check["validation_status"] == "PASS"
          print("| Case | Strict numerical agreement | Timing stability | Timing comparison admitted |")
          print("| --- | --- | --- | --- |")
          for name, case in report["cases"].items():
              fields = ["Pass" if case[key] else "Fail" for key in
                        ("strict_numeric_admitted", "timing_stability_admitted", "benchmark_admitted")]
              print(f"| {name} | {' | '.join(fields)} |")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minuit2-benchmark-record
          path: ${{ runner.temp }}/minuit2-record/

  # Per-push minimal: just Julia 1 on Ubuntu. ~5 billable minutes,
  # gives fast feedback. macos is 10× billing — only on schedule/tag.
  test-minimal:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.compare-minuit2)
    name: Julia 1 - ubuntu-latest - ${{ github.event_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: '4'
      - name: Check isolated consumers and extension load orders
        run: julia --startup-file=no scripts/check_extension_loading.jl
      - name: Prepare local benchmark-tool environment
        run: julia --startup-file=no --project=benchmark -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Check measurement records and failure controls
        run: |
          python3 -m unittest discover -s benchmark -p 'test_readme_comparison.py'
          julia --startup-file=no --project=benchmark benchmark/test_readme_evidence.jl
          julia --startup-file=no --threads=2 --project=benchmark benchmark/test_runner.jl
          julia --startup-file=no --threads=2 --project=benchmark benchmark/test_package_evidence.jl
          julia --startup-file=no --threads=2 --project=benchmark benchmark/test_atomic_writes.jl
          julia --startup-file=no --threads=2 --project=benchmark benchmark/test_blas_configuration.jl
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
        continue-on-error: true   # codecov upload is best-effort

  # Full matrix: tags + monthly schedule + manual dispatch. One macOS job
  # (macos-14, Apple Silicon — macOS bills 10×); Julia 1.11 is the declared
  # compat floor (Project.toml: julia = "1.11").
  test-full:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.compare-minuit2)
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - full
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.11'              # compat floor
          - '1'                 # current stable
        os:
          - ubuntu-latest
        arch:
          - x64
        include:
          # One macOS job (macOS bills 10×): Apple-Silicon native, Julia 1
          # only. Dropped macOS-latest/x64 (that runner is being retired).
          - os: macos-14
            version: '1'
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: '4'
      - name: Check isolated consumers and extension load orders
        run: julia --startup-file=no scripts/check_extension_loading.jl
      - name: Prepare local benchmark-tool environment
        run: julia --startup-file=no --project=benchmark -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Check measurement records and failure controls
        run: |
          python3 -m unittest discover -s benchmark -p 'test_readme_comparison.py'
          julia --startup-file=no --project=benchmark benchmark/test_readme_evidence.jl
          julia --startup-file=no --threads=2 --project=benchmark benchmark/test_runner.jl
          julia --startup-file=no --threads=2 --project=benchmark benchmark/test_package_evidence.jl
          julia --startup-file=no --threads=2 --project=benchmark benchmark/test_atomic_writes.jl
          julia --startup-file=no --threads=2 --project=benchmark benchmark/test_blas_configuration.jl

  jet-diagnostics:
    if: github.event_name != 'workflow_dispatch' || !inputs.compare-minuit2
    name: JET diagnostics - Julia 1.11.7 / JET 0.9.20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11.7'
          arch: x64
      - uses: julia-actions/cache@v2
      - name: Resolve isolated diagnostic environment
        run: julia --startup-file=no --project=scripts/jet -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Execute narrow diagnostics (unavailable is a failure)
        run: julia --startup-file=no --project=scripts/jet scripts/jet/run.jl
        env:
          NATIVEMINUIT_JET_STATUS: jet-status.toml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jet-diagnostic-status
          path: jet-status.toml
          if-no-files-found: error
