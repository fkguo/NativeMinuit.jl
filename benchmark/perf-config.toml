[mode]
mode = "standalone"

[target]
module = "NativeMinuit"
source_root = ".."
source_files = ["src", "Project.toml", "benchmark/bench_migrad_suite.jl", "benchmark/fixtures/migrad_inputs.json"]

[benchmark]
suite_file = "bench_migrad_suite.jl"
baseline_file = ""
input_files = ["fixtures/migrad_inputs.json"]
samples = 50
seconds = 1
timeout_seconds = 600

[benchmark.evals]
policy = "fixed"
fixed_value = 1

[regression]
# No threshold is inferred from old measurements. An empty table is UNVERIFIED.

[output]
out_dir = ".julia-perf/runs/latest"

[blas]
# Applied to the owned worker's OpenBLAS and OpenMP thread limits.
num_threads = 1
